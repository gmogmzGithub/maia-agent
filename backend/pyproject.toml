[project]
name = "maia-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "django-ninja>=1.4,<2",
  "procrastinate[django]>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "anthropic>=0.70,<1",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
  "phonenumbers>=9,<10",
  "cryptography>=46,<51",
  "pillow>=12,<13",
  "pillow-heif>=1,<2",
  "pypdf>=6,<7",
  "reportlab>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.12", "httpx>=0.28"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "maia.settings"
python_files = ["test_*.py"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
