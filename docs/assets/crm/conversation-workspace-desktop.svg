<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Bandeja de conversaciones de Larevia</title>
  <desc id="desc">Espacio de conversación con cola priorizada, historial, autoridad de manejo y contexto comercial.</desc>
  <style>
    .brand { font: 600 27px Newsreader, Georgia, serif; fill: #ffffff; }
    .nav { font: 500 14px Inter, Arial, sans-serif; fill: #dfe7e3; }
    .h1 { font: 600 27px Inter, Arial, sans-serif; fill: #17211d; }
    .h2 { font: 600 17px Inter, Arial, sans-serif; fill: #17211d; }
    .body { font: 400 14px Inter, Arial, sans-serif; fill: #17211d; }
    .small { font: 400 11px Inter, Arial, sans-serif; fill: #657069; }
    .label { font: 600 10px Inter, Arial, sans-serif; }
    .button { font: 600 13px Inter, Arial, sans-serif; }
  </style>
  <rect width="1440" height="1000" fill="#f7f5ef"/>
  <rect width="205" height="1000" fill="#17211d"/>
  <text class="brand" x="24" y="46">Larevia</text>
  <text x="24" y="67" font-family="Inter, Arial, sans-serif" font-size="10" fill="#aebbb5">OPERADO CON MAIA</text>
  <text class="nav" x="24" y="124">Hoy</text>
  <rect x="12" y="145" width="181" height="44" rx="7" fill="#315c4c"/>
  <text x="24" y="172" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Bandeja</text>
  <rect x="153" y="156" width="24" height="22" rx="11" fill="#d3a446"/>
  <text x="165" y="171" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#17211d">2</text>
  <text class="nav" x="24" y="226">Agenda</text>
  <text class="nav" x="24" y="270">Oportunidades</text>
  <text class="nav" x="24" y="314">Contactos</text>
  <text class="nav" x="24" y="358">Catálogo</text>
  <line x1="18" y1="398" x2="187" y2="398" stroke="#405049"/>
  <text class="nav" x="24" y="438">Alertas</text>
  <text x="24" y="938" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Mariana Torres</text>
  <text x="24" y="958" font-family="Inter, Arial, sans-serif" font-size="10" fill="#aebbb5">Asesora inmobiliaria</text>

  <text class="h1" x="229" y="50">Bandeja</text>
  <text class="small" x="229" y="73">Mi trabajo · Actualizado hoy, 10:42</text>
  <rect x="1187" y="24" width="229" height="42" rx="8" fill="#ffffff" stroke="#d9d6cd"/>
  <text x="1204" y="50" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#315c4c">2 conversaciones esperan</text>

  <rect x="229" y="96" width="270" height="856" rx="10" fill="#ffffff" stroke="#d9d6cd"/>
  <text class="h2" x="249" y="127">Prioridad</text>
  <rect x="249" y="143" width="230" height="38" rx="7" fill="#f7f5ef" stroke="#d9d6cd"/>
  <text class="small" x="264" y="167">Buscar conversación</text>
  <rect x="249" y="197" width="230" height="144" rx="8" fill="#e5efeb" stroke="#315c4c" stroke-width="2"/>
  <rect x="265" y="213" width="58" height="22" rx="11" fill="#f9e8e3"/>
  <text x="294" y="228" text-anchor="middle" class="label" fill="#7a2e22">AHORA</text>
  <text x="265" y="260" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#17211d">Sofía Hernández</text>
  <text class="body" x="265" y="284">“Todavía estoy revisando…”</text>
  <text class="small" x="265" y="307">Espera hace 18 min</text>
  <text class="small" x="265" y="327">Calificada · Mariana</text>

  <rect x="249" y="353" width="230" height="122" rx="8" fill="#ffffff" stroke="#e0ddd5"/>
  <rect x="265" y="369" width="52" height="22" rx="11" fill="#fbf1d6"/>
  <text x="291" y="384" text-anchor="middle" class="label" fill="#664a05">HOY</text>
  <text x="265" y="415" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#17211d">Mateo Aguilar</text>
  <text class="body" x="265" y="438">“Gracias, lo reviso.”</text>
  <text class="small" x="265" y="458">Acción vencida · Diego</text>

  <rect x="249" y="487" width="230" height="122" rx="8" fill="#ffffff" stroke="#e0ddd5"/>
  <rect x="265" y="503" width="74" height="22" rx="11" fill="#fbf1d6"/>
  <text x="302" y="518" text-anchor="middle" class="label" fill="#664a05">REVISIÓN</text>
  <text x="265" y="549" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#17211d">Daniel Cárdenas</text>
  <text class="body" x="265" y="572">Busca opciones en Zapopan</text>
  <text class="small" x="265" y="592">Sin asesor · espera 46 min</text>
  <text class="small" x="249" y="642">3 conversaciones al día</text>
  <text x="249" y="672" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#315c4c">Ver toda la Bandeja →</text>

  <rect x="519" y="96" width="527" height="856" rx="10" fill="#ffffff" stroke="#d9d6cd"/>
  <text class="h2" x="543" y="127">Sofía Hernández</text>
  <text class="small" x="543" y="148">WhatsApp · termina en 4821 · Calificada</text>
  <rect x="543" y="164" width="479" height="54" rx="8" fill="#e5efeb" stroke="#bdd4c5"/>
  <text x="559" y="187" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#315c4c">Mariana atiende · Maia en pausa</text>
  <text class="small" x="559" y="205">Tomaste esta conversación hoy, 10:26</text>

  <text class="small" x="543" y="249">HOY</text>
  <rect x="543" y="266" width="356" height="72" rx="10" fill="#f2f0ea"/>
  <text class="body" x="559" y="292">Hola, busco una casa en Zapopan con tres</text>
  <text class="body" x="559" y="314">recámaras y espacio para trabajar.</text>
  <text class="small" x="859" y="330">10:19</text>

  <rect x="635" y="354" width="387" height="92" rx="10" fill="#e5efeb"/>
  <text class="body" x="651" y="380">Claro. Tengo opciones autorizadas en varias</text>
  <text class="body" x="651" y="402">zonas. ¿Qué rango y fecha aproximada tienes?</text>
  <text class="small" x="982" y="430">Maia · 10:20</text>

  <rect x="543" y="462" width="395" height="92" rx="10" fill="#f2f0ea"/>
  <text class="body" x="559" y="488">Podría ser alrededor de seis millones, pero</text>
  <text class="body" x="559" y="510">todavía estoy revisando el límite máximo.</text>
  <text class="small" x="898" y="538">10:24</text>

  <rect x="543" y="579" width="479" height="50" rx="8" fill="#fff8e6" stroke="#ead59a"/>
  <text x="559" y="601" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#664a05">Espera tu respuesta desde hace 18 min</text>
  <text class="small" x="559" y="618">Ventana de servicio abierta · contacto permitido</text>

  <rect x="543" y="653" width="479" height="137" rx="8" fill="#ffffff" stroke="#7f8b84"/>
  <text class="small" x="559" y="677">Responder como Mariana</text>
  <text x="559" y="710" font-family="Inter, Arial, sans-serif" font-size="14" fill="#657069">Escribe una respuesta clara y útil…</text>
  <line x1="559" y1="745" x2="1006" y2="745" stroke="#e0ddd5"/>
  <text class="small" x="559" y="772">El envío será confirmado por Product.</text>
  <rect x="879" y="755" width="127" height="38" rx="7" fill="#315c4c"/>
  <text x="942.5" y="779" text-anchor="middle" class="button" fill="#ffffff">Enviar respuesta</text>

  <rect x="543" y="810" width="204" height="42" rx="7" fill="#ffffff" stroke="#315c4c"/>
  <text x="645" y="836" text-anchor="middle" class="button" fill="#315c4c">Liberar conversación</text>
  <text class="small" x="543" y="875">Al liberar, Maia podrá continuar sólo si Product lo permite.</text>

  <rect x="1066" y="96" width="350" height="856" rx="10" fill="#ffffff" stroke="#d9d6cd"/>
  <text class="h2" x="1088" y="127">Contexto operativo</text>
  <text class="small" x="1088" y="155">CONTACTO</text>
  <text x="1088" y="181" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#17211d">Sofía Hernández</text>
  <text class="body" x="1088" y="204">WhatsApp · termina en 4821</text>
  <text x="1088" y="230" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#315c4c">Abrir contacto →</text>
  <line x1="1088" y1="252" x2="1394" y2="252" stroke="#e0ddd5"/>

  <text class="small" x="1088" y="281">OPORTUNIDAD</text>
  <text x="1088" y="307" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#17211d">Compra en Zapopan</text>
  <rect x="1088" y="321" width="78" height="24" rx="12" fill="#e5efeb"/>
  <text x="1127" y="337" text-anchor="middle" class="label" fill="#315c4c">CALIFICADA</text>
  <text class="body" x="1088" y="374">Asesora: Mariana Torres</text>
  <text class="body" x="1088" y="399">Cobertura: vigente</text>
  <text x="1088" y="426" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#315c4c">Abrir oportunidad →</text>
  <line x1="1088" y1="448" x2="1394" y2="448" stroke="#e0ddd5"/>

  <text class="small" x="1088" y="477">SIGUIENTE ACCIÓN</text>
  <text x="1088" y="504" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#17211d">Confirmar presupuesto máximo</text>
  <text class="body" x="1088" y="529">Hoy, 11:30 · Mariana</text>
  <rect x="1088" y="544" width="72" height="24" rx="12" fill="#fbf1d6"/>
  <text x="1124" y="560" text-anchor="middle" class="label" fill="#664a05">REVISIÓN</text>
  <line x1="1088" y1="586" x2="1394" y2="586" stroke="#e0ddd5"/>

  <text class="small" x="1088" y="615">NECESIDAD</text>
  <text class="body" x="1088" y="642">Compra · Zapopan</text>
  <text class="body" x="1088" y="667">3 recámaras · espacio de trabajo</text>
  <text class="body" x="1088" y="692">Horizonte: 3–6 meses</text>
  <rect x="1088" y="708" width="232" height="28" rx="7" fill="#fff8e6"/>
  <text x="1100" y="727" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#664a05">Presupuesto máximo por confirmar</text>
  <line x1="1088" y1="758" x2="1394" y2="758" stroke="#e0ddd5"/>

  <text class="small" x="1088" y="787">COMUNICACIÓN</text>
  <rect x="1088" y="804" width="153" height="26" rx="13" fill="#e6f0e9"/>
  <text x="1164.5" y="821" text-anchor="middle" class="label" fill="#214f36">CONTACTO PERMITIDO</text>
  <text class="body" x="1088" y="856">Ventana abierta hasta mañana, 10:24</text>
  <text class="small" x="1088" y="880">Sin restricción activa</text>
</svg>
