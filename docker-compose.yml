name: maia

# Maia's complete local runtime. All application processes run in containers:
# PostgreSQL owns durable state, Product owns deterministic business authority,
# and Hermes owns conversation and tool selection.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: realestate
      POSTGRES_DB: realestate
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate -d realestate"]
      interval: 2s
      timeout: 3s
      retries: 30

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ROOT_USER:?Set OBJECT_STORAGE_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_ROOT_PASSWORD:?Set OBJECT_STORAGE_ROOT_PASSWORD in .env}
    volumes:
      - object-storage-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      options:
        max-size: 10m
        max-file: "3"

  object-storage-init:
    image: quay.io/minio/mc:RELEASE.2025-05-21T01-59-54Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set sandbox http://object-storage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "sandbox/$$ORIGINALS_BUCKET"
        mc mb --ignore-existing "sandbox/$$CACHE_BUCKET"
        mc anonymous set none "sandbox/$$ORIGINALS_BUCKET"
        mc anonymous set none "sandbox/$$CACHE_BUCKET"
        mc admin user add sandbox "$$PRODUCT_ACCESS_KEY" "$$PRODUCT_SECRET_KEY"
        mc admin policy create sandbox maia-listing-media /config/media-policy.json
        mc admin policy attach sandbox maia-listing-media --user "$$PRODUCT_ACCESS_KEY"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ROOT_USER:?Set OBJECT_STORAGE_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_ROOT_PASSWORD:?Set OBJECT_STORAGE_ROOT_PASSWORD in .env}
      PRODUCT_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY_ID:?Set OBJECT_STORAGE_ACCESS_KEY_ID in .env}
      PRODUCT_SECRET_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?Set OBJECT_STORAGE_SECRET_ACCESS_KEY in .env}
      ORIGINALS_BUCKET: maia-listing-media
      CACHE_BUCKET: maia-listing-renditions
    volumes:
      - ./docker/minio-media-policy.json:/config/media-policy.json:ro
    depends_on:
      object-storage:
        condition: service_healthy
    restart: "no"

  product:
    build:
      context: .
      dockerfile: docker/product.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: postgresql+psycopg://realestate:realestate@db:5432/realestate
      TEST_DATABASE_URL: postgresql+psycopg://realestate:realestate@db:5432/realestate_test
      HERMES_BASE_URL: http://127.0.0.1:9119
      HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:?Set HERMES_DASHBOARD_SESSION_TOKEN in .env}
      PLUGIN_API_TOKEN: ${PLUGIN_API_TOKEN:?Set PLUGIN_API_TOKEN in .env}
      ARTIFACT_ROOT: /app/var/property-documents
      PROPERTY_CATALOG_ROOT: /app/src/properties
      OBJECT_STORAGE_ENDPOINT_URL: http://object-storage:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ORIGINALS_BUCKET: maia-listing-media
      OBJECT_STORAGE_CACHE_BUCKET: maia-listing-renditions
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?Set OBJECT_STORAGE_ACCESS_KEY_ID in .env}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?Set OBJECT_STORAGE_SECRET_ACCESS_KEY in .env}
      # Per-Organization export artifacts. On its own durable volume because an
      # export is a customer deliverable: losing it to a container rebuild would
      # mean regenerating somebody's entire record set to answer one request.
      ORGANIZATION_EXPORT_ROOT: /app/var/organization-exports
    depends_on:
      db:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - property-documents:/app/var/property-documents
      - organization-exports:/app/var/organization-exports
      - ./src/properties:/app/src/properties
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  # Explicit, one-time bridge from the retired filesystem volume. It is never
  # part of the normal runtime and copies only objects PostgreSQL still names.
  media-migrate:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: docker/product.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://realestate:realestate@db:5432/realestate
      OBJECT_STORAGE_ENDPOINT_URL: http://object-storage:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ORIGINALS_BUCKET: maia-listing-media
      OBJECT_STORAGE_CACHE_BUCKET: maia-listing-renditions
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?Set OBJECT_STORAGE_ACCESS_KEY_ID in .env}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?Set OBJECT_STORAGE_SECRET_ACCESS_KEY in .env}
    command:
      - python
      - -m
      - realestate.media_migrate
      - --source-root
      - /app/var/legacy-listing-media/originals
      - --confirm
    depends_on:
      db:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    volumes:
      - listing-media:/app/var/legacy-listing-media:ro

  hermes:
    build:
      context: .
      dockerfile: docker/hermes.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HERMES_HOME: /opt/hermes-home
      HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:?Set HERMES_DASHBOARD_SESSION_TOKEN in .env}
      REALESTATE_PLUGIN_API_TOKEN: ${PLUGIN_API_TOKEN:?Set PLUGIN_API_TOKEN in .env}
      REALESTATE_BACKEND_URL: http://127.0.0.1:8080
    # Hermes intentionally accepts its session-token protocol only on loopback.
    # Sharing Product's private network namespace gives the two separate
    # containers a loopback link without exposing Hermes on the host network.
    network_mode: service:product
    depends_on:
      product:
        condition: service_started
    volumes:
      - hermes-state:/opt/hermes-home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9119/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  site:
    build:
      context: .
      dockerfile: docker/product.Dockerfile
    restart: unless-stopped
    environment:
      PRODUCT_INTERNAL_BASE_URL: http://127.0.0.1:8080
      PUBLIC_SITE_BASE_URL: http://127.0.0.1:8081
      SITE_PUBLIC_ORIGIN: ${SITE_PUBLIC_ORIGIN:-http://localhost:8080}
      SITE_PRODUCT_API_TOKEN: ${SITE_PRODUCT_API_TOKEN:-}
      OFFICIAL_WHATSAPP_NUMBER: ${OFFICIAL_WHATSAPP_NUMBER:-}
    command:
      - uvicorn
      - realestate.site.app:app
      - --host
      - 127.0.0.1
      - --port
      - "8081"
    network_mode: service:product
    depends_on:
      product:
        condition: service_healthy
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:
  hermes-state:
  property-documents:
  # Retained read-only for the explicit migration profile; Product never mounts it.
  listing-media:
  object-storage-data:
  organization-exports:
