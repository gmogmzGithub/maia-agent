name: token-free tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: token-free-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Create credential-free CI environment
        run: |
          cp .env.example .env
          sed -i 's/^WORKER_ENABLED=.*/WORKER_ENABLED=false/' .env
          sed -i 's/^HERMES_DASHBOARD_SESSION_TOKEN=.*/HERMES_DASHBOARD_SESSION_TOKEN=ci-hermes-token/' .env
          sed -i 's/^PLUGIN_API_TOKEN=.*/PLUGIN_API_TOKEN=ci-plugin-token/' .env
          sed -i 's/^DEVELOPER_BASIC_PASSWORD=.*/DEVELOPER_BASIC_PASSWORD=ci-developer-password/' .env
          sed -i 's/^META_VERIFY_TOKEN=.*/META_VERIFY_TOKEN=ci-verify-token/' .env
          sed -i 's/^META_APP_SECRET=.*/META_APP_SECRET=ci-app-secret/' .env
          sed -i 's/^META_ACCESS_TOKEN=.*/META_ACCESS_TOKEN=/' .env
          sed -i 's/^META_PHONE_NUMBER_ID=.*/META_PHONE_NUMBER_ID=/' .env
          sed -i 's/^ANTHROPIC_API_KEY=.*/ANTHROPIC_API_KEY=/' .env
          sed -i 's/^TELEGRAM_BOT_TOKEN=.*/TELEGRAM_BOT_TOKEN=/' .env
          sed -i 's/^TELEGRAM_ADMIN_IDS=.*/TELEGRAM_ADMIN_IDS=/' .env
          sed -i 's|^GOOGLE_CALENDAR_CREDENTIALS=.*|GOOGLE_CALENDAR_CREDENTIALS=|' .env
          sed -i 's/^GOOGLE_CALENDAR_ID=.*/GOOGLE_CALENDAR_ID=/' .env
          sed -i 's/^RUN_CONVERSATION_TESTS=.*/RUN_CONVERSATION_TESTS=0/' .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build the complete runtime
        run: docker compose build product hermes

      - name: Start Product, Hermes, and PostgreSQL
        run: docker compose up -d --wait --wait-timeout 180 db product hermes

      - name: Prove the private Product and Hermes path
        run: |
          docker compose exec -T product curl -fsS http://127.0.0.1:8080/live
          docker compose exec -T product curl -fsS http://127.0.0.1:9119/api/health

      - name: Lint
        run: docker compose exec -T product ruff check src plugin tests migrations

      - name: Run every token-free test
        run: |
          docker compose exec -T product pytest \
            -m 'not live_provider' \
            --strict-markers \
            --junitxml=/tmp/token-free-junit.xml \
            --cov=src/realestate \
            --cov=plugin/realestate_hermes_plugin \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:/tmp/token-free-coverage.xml \
            --cov-fail-under=97

      - name: Copy test reports
        if: always()
        run: |
          docker compose cp product:/tmp/token-free-junit.xml token-free-junit.xml || true
          docker compose cp product:/tmp/token-free-coverage.xml token-free-coverage.xml || true

      - name: Refuse silently skipped scenarios
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("token-free-junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          if skipped:
              raise SystemExit(f"token-free CI skipped {skipped} scenario(s)")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: token-free-test-reports
          path: |
            token-free-junit.xml
            token-free-coverage.xml
          if-no-files-found: ignore

      - name: Show runtime logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the CI runtime
        if: always()
        run: docker compose down -v
