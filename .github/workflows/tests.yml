name: Maia tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maia
          POSTGRES_USER: maia
          POSTGRES_PASSWORD: maia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maia -d maia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://maia:maia_ci@127.0.0.1:5432/maia
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-ephemeral-test-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned dependency tools
        run: |
          python -m pip install uv==0.9.5
          npm install --global pnpm@11.25.0
      - name: Check public dependency sources
        run: python backend/scripts/check_dependency_sources.py
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Check backend
        working-directory: backend
        run: |
          uv run ruff check .
          uv run python manage.py makemigrations --check --dry-run
          uv run pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Check frontend
        working-directory: frontend
        run: |
          pnpm test
          pnpm typecheck
          pnpm build
