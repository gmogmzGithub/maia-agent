name: token-free tests

on:
  pull_request:
  # Pull request branches are already covered by the event above. Listing them
  # here too would run the whole job twice per commit: push and pull_request
  # produce different github.ref values, so concurrency cannot collapse them.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Appended rather than substituted: Compose and the test suite both take
      # the last assignment of a key, so this block is the authority regardless
      # of what .env.example ships. Every provider credential is blanked here
      # even where the example is already empty, so CI stays credential-free if
      # the example ever gains a value.
      - name: Create credential-free CI environment
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'
          WORKER_ENABLED=false
          HERMES_DASHBOARD_SESSION_TOKEN=ci-hermes-token
          PLUGIN_API_TOKEN=ci-plugin-token
          DEVELOPER_BASIC_PASSWORD=ci-developer-password
          META_VERIFY_TOKEN=ci-verify-token
          META_APP_SECRET=ci-app-secret
          META_ACCESS_TOKEN=
          META_PHONE_NUMBER_ID=
          ANTHROPIC_API_KEY=
          TELEGRAM_BOT_TOKEN=
          TELEGRAM_ADMIN_IDS=
          GOOGLE_CALENDAR_CREDENTIALS=
          GOOGLE_CALENDAR_ID=
          RUN_CONVERSATION_TESTS=0
          ENV

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build the complete runtime
        run: docker compose build product hermes

      # --wait holds until Compose's own healthchecks pass, which are the
      # loopback probes of Product's /live and Hermes's /api/health. Reaching
      # this step is the proof that the private Product-to-Hermes path works.
      - name: Start Product, Hermes, and PostgreSQL
        run: docker compose up -d --wait --wait-timeout 180 db product hermes

      - name: Lint
        run: docker compose exec -T product ruff check src plugin tests migrations

      # The measured packages and the coverage floor live in pyproject.toml so
      # this command and the one in docs/testing.md cannot drift apart.
      - name: Run every token-free test
        run: |
          docker compose exec -T product pytest \
            -m 'not live_provider' \
            --strict-markers \
            --junitxml=/tmp/token-free-junit.xml \
            --cov \
            --cov-report=term \
            --cov-report=xml:/tmp/token-free-coverage.xml

      - name: Copy test reports
        if: always()
        run: |
          docker compose cp product:/tmp/token-free-junit.xml token-free-junit.xml
          docker compose cp product:/tmp/token-free-coverage.xml token-free-coverage.xml

      # A skip means a required service never came up, so an integration
      # scenario that proves nothing would otherwise report green.
      - name: Refuse silently skipped scenarios
        run: |
          if grep -q '<skipped' token-free-junit.xml; then
            grep -o 'name="[^"]*"[^>]*>\s*<skipped' token-free-junit.xml || true
            echo "::error::token-free CI skipped at least one scenario"
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: token-free-test-reports
          path: |
            token-free-junit.xml
            token-free-coverage.xml
          if-no-files-found: ignore

      # Tailed deliberately: LOG_LEVEL is DEBUG and Compose keeps up to 30MB
      # per service, so an untrimmed dump buries the lines that matter.
      - name: Show runtime logs after failure
        if: failure()
        run: docker compose logs --no-color --timestamps --tail 300

      - name: Stop the CI runtime
        if: always()
        run: docker compose down -v
