name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realestate
          POSTGRES_PASSWORD: realestate
          POSTGRES_DB: realestate
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U realestate -d realestate"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql+psycopg://realestate:realestate@127.0.0.1:5433/realestate
      TEST_DATABASE_URL: postgresql+psycopg://realestate:realestate@127.0.0.1:5433/realestate_test
      HERMES_DASHBOARD_SESSION_TOKEN: local-test-hermes-token
      PLUGIN_API_TOKEN: local-test-plugin-token
      REALESTATE_PLUGIN_API_TOKEN: local-test-plugin-token
      DEVELOPER_BASIC_PASSWORD: local-test-developer-password
      META_VERIFY_TOKEN: local-test-verify-token
      META_APP_SECRET: local-test-app-secret
      META_ACCESS_TOKEN: local-test-access-token
      META_PHONE_NUMBER_ID: local-test-phone-number
      RUN_CONVERSATION_TESTS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[dev]"

      - name: Create synthetic local env
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          values = {
              "HERMES_DASHBOARD_SESSION_TOKEN": "local-test-hermes-token",
              "PLUGIN_API_TOKEN": "local-test-plugin-token",
              "REALESTATE_PLUGIN_API_TOKEN": "local-test-plugin-token",
              "DEVELOPER_BASIC_PASSWORD": "local-test-developer-password",
              "META_VERIFY_TOKEN": "local-test-verify-token",
              "META_APP_SECRET": "local-test-app-secret",
              "META_ACCESS_TOKEN": "local-test-access-token",
              "META_PHONE_NUMBER_ID": "local-test-phone-number",
          }
          path = Path(".env")
          lines = []
          for line in path.read_text().splitlines():
              key = line.split("=", 1)[0] if "=" in line and not line.startswith("#") else None
              lines.append(f"{key}={values[key]}" if key in values else line)
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Run tests
        run: |
          PYTHONPATH=. .venv/bin/pytest
