[project]
name = "maia-agent"
version = "0.1.0"
description = "Hermes-backed real estate lead agent with deterministic workflow authority"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn[standard]==0.40.0",
    "sqlalchemy[asyncio]==2.0.44",
    "alembic==1.18.1",
    "psycopg[binary]==3.2.13",
    "pydantic==2.13.4",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "websockets==15.0.1",
    "python-multipart==0.0.20",
    "pyyaml==6.0.3",
    # Google Calendar is the authoritative source of Broker availability (S-007).
    "google-api-python-client==2.189.0",
    "google-auth==2.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "anyio==4.11.0",
    "pytest-cov==7.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["realestate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:realestate.*"]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs domain code inside greenlets, which the C
# tracer cannot follow: it reported whole service bodies as unexecuted even
# though the tests drove them. PEP 669 monitoring sees through the switch.
#
# Branch coverage stays off deliberately: on Python 3.12 the sysmon core does
# not implement it, so asking for branches silently drops back to the C tracer
# and the greenlet blind spot returns.
core = "sysmon"
source = ["src/realestate", "plugin/realestate_hermes_plugin"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
