[project]
name = "maia-agent"
version = "0.1.0"
description = "Hermes-backed real estate lead agent with deterministic workflow authority"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.40.0",
    "sqlalchemy[asyncio]==2.0.44",
    "alembic==1.18.1",
    "psycopg[binary]==3.2.13",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "websockets==15.0.1",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "pillow==12.3.0",
    # Google Calendar is the authoritative source of Broker availability (S-007).
    "google-api-python-client==2.189.0",
    "google-auth==2.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "anyio==4.11.0",
    "pytest-cov==7.0.0",
    "ruff==0.12.12",
    "mypy==1.18.2",
    "types-PyYAML==6.0.12.20250915",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["realestate*"]

[tool.mypy]
# The product's claim is deterministic authority beneath a probabilistic model.
# A union return like ``Queued | Denied`` only carries that claim if a caller
# cannot read ``outbox_id`` off a refusal, and only a checker can enforce that.
# Strict from the start: a permissive baseline with a promised ratchet never
# gets ratcheted.
python_version = "3.12"
strict = true
files = ["src/realestate", "plugin/realestate_hermes_plugin"]
# Product code says what it means; the annotations are the point.
disallow_any_generics = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# Google's client libraries ship neither stubs nor a py.typed marker. Confined
# to the two boundary modules that actually touch them, so an untyped value
# cannot silently spread into the domain.
module = ["googleapiclient.*", "google.oauth2.*", "google.auth.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:realestate.*"]
markers = [
    "live_provider: calls a real model provider and is excluded from token-free CI",
    "live_external_inventory: opt-in read-only call to EasyBroker staging",
]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs domain code inside greenlets, which the C
# tracer cannot follow: it reported whole service bodies as unexecuted even
# though the tests drove them. PEP 669 monitoring sees through the switch.
#
# Branch coverage stays off deliberately: on Python 3.12 the sysmon core does
# not implement it, so asking for branches silently drops back to the C tracer
# and the greenlet blind spot returns.
core = "sysmon"
source = ["src/realestate", "plugin/realestate_hermes_plugin"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The required gate's floor. Kept here rather than on the CI command line so
# the workflow and docs/run/everything-locally.md cannot disagree about the threshold.
fail_under = 97
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
